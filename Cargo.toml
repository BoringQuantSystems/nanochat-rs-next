[package]
name = "nanochat-rs"
version = "0.1.0"
edition = "2024"
description = "Rust-first nanochat continuation for benchmark-driven training, eval, and inference experiments."
license = "Apache-2.0"

[features]
default = []
tch-backend = ["dep:tch"]

[dependencies]
clap = { version = "4.5.30", features = ["derive"] }
rand = "0.10.3"
tch = { version = "0.26.0", optional = true }
